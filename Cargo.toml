[package]
name = "vtmate"
version = "0.6.0"
edition = "2024"
build = "build.rs"

authors = ["David Valin <hola@davidvalin.com>"]
homepage = "https://github.com/DavidValin/vtmate"
repository = "https://github.com/DavidValin/vtmate"
description = "A simple audio ai conversation system"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
anyhow = "1.0"
serde_ini = "0.2.0"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", features = ["stream", "multipart", "blocking", "json", "native-tls-vendored"] }
llm = { version = "1.3.8", default-features = false, features = ["openai", "anthropic", "google", "groq", "mistral", "openrouter", "deepseek", "xai", "default-tls"] }
futures-util = "0.3"   # for StreamExt
bytes = "1.4"          # for Bytes in streaming
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
url = "2"
whisper-rs = { version = "0.15.1", default-features = false }
ort = { version = "2.0.0-rc.11", features = [ "std", "ndarray", "tls-rustls" ] }
hound = "3"
crossterm = { version = "0.27", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
ctrlc = { version = "3", features = ["termination"] }
kokoro-micro = "1.0.0"
supersonic2-tts = "1.2.0"
supertonic3-tts = "1.3.0"
espeak-rs = "0.1.9"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "5"
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
chrono = "0.4.44"
uuid = { version = "1.23.1", features = ["v4"] }
# daemon mode: global hotkeys, clipboard / selection, synthetic key presses, IPC
global-hotkey = "0.8"
arboard = { version = "3.6", default-features = false }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
interprocess = "2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "xfixes"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
flate2 = "1"
tar = "0.4"

[features]
default               = []
whisper-openblas      = ["whisper-rs/openblas"]
whisper-vulkan        = ["whisper-rs/vulkan"]
whisper-cuda          = ["whisper-rs/cuda"]
whisper-hipblas       = ["whisper-rs/hipblas"]
whisper-metal         = ["whisper-rs/metal"]
whisper-logs          = ["whisper-rs/log_backend", "whisper-rs/tracing_backend"]
ort-download-binaries = ["ort/download-binaries"]
# CUDA for every ONNX Runtime user: whisper is separate (whisper-cuda), but the
# two TTS crates share vtmate's ort and need their own feature flipped to
# register the CUDA execution provider.
ort-cuda              = ["ort/cuda", "supertonic3-tts/cuda", "supersonic2-tts/cuda"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
incremental = false

