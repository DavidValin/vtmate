name: Release

# Triggers when a tag is pushed. A guard job verifies the tagged
# commit is reachable from the main branch before building.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git branch -r --contains "$GITHUB_REF" | grep -qE '(^|/)main$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF is not reachable from main. Skipping release." >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  # Reuses build.yml rather than restating the matrix. Every platform quirk -
  # the musl toolchain image, the CUDA component overlay, the prebuilt ONNX
  # Runtime, the arm64 runner - lives in one place and cannot drift between
  # the CI and release paths.
  build:
    name: Build
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    uses: ./.github/workflows/build.yml

  release:
    name: Create release & upload assets
    needs: [guard, build]
    if: needs.guard.outputs.ok == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # No merge-multiple: each artifact keeps its own directory. The Windows
      # CUDA variant ships DLLs alongside the exe, and flattening everything
      # into one directory would collide those.
      # Checked out only to read the version from Cargo.toml, so every asset
      # is named from the same source build_linux.sh uses.
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what was built
        run: find artifacts -type f | sort

      # LICENSE.third_party lists the license of every crate in Cargo.lock. It
      # is regenerated from the tagged commit's Cargo.lock so the archives
      # never carry a stale list (the hand-written native libraries and models
      # section after its marker line is kept as is). The regenerated file is
      # only packaged, not committed.
      - name: Regenerate LICENSE.third_party
        run: |
          set -euo pipefail
          CARGO_ABOUT_VERSION=0.9.2
          BIN_DIR="$HOME/.cargo/bin"
          mkdir -p "$BIN_DIR"
          export PATH="$BIN_DIR:$PATH"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$BIN_DIR" "cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/cargo-about" \
            || { echo "failed to install cargo-about" >&2; exit 1; }
          scripts/third_party_licenses.sh
          if git diff --quiet -- LICENSE.third_party; then
            echo "LICENSE.third_party was already up to date"
          else
            echo "::warning::LICENSE.third_party in the repo was stale, the release archives carry the regenerated one; commit the regenerated file"
            git diff --stat -- LICENSE.third_party
          fi

      # Asset naming: vtmate-<version>-<os>-<arch>[-<variant>].<tgz|zip>, with
      # the binary (plus any bundled DLLs on Windows) at the archive's top
      # level. The CI artifact name is the <os>-<arch>[-<variant>] part.
      - name: Package one asset per variant
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '$1 ~ /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          [ -n "$VERSION" ] || { echo "Failed to read version from Cargo.toml" >&2; exit 1; }
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "warning: tag ${GITHUB_REF_NAME} differs from Cargo.toml version ${VERSION}; assets use ${VERSION}" >&2
          fi
          mkdir -p release_assets

          # Rendered (README.pdf) or copied (quicksheet.pdf) by build.yml's
          # docs job, as siblings in the same artifact directory. Every .tgz
          # carries a copy of both at its top level, beside the binary, so
          # the manual and the printable cheat sheet ship with the release.
          PDF="$(find artifacts/readme-pdf -name README.pdf | head -1)"
          [ -n "$PDF" ] || { echo "README.pdf missing from build artifacts" >&2; exit 1; }
          QUICKSHEET="$(find artifacts/readme-pdf -name quicksheet.pdf | head -1)"
          [ -n "$QUICKSHEET" ] || { echo "quicksheet.pdf missing from build artifacts" >&2; exit 1; }
          PDF_DIR="$(dirname "$PDF")"

          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            # The PDF is an input to the loop, not a variant of its own.
            if [ "$name" = readme-pdf ]; then continue; fi

            # Linux: build_linux.sh already packaged the .tgz, so add the PDF
            # by peeling off the gzip layer, appending to the tar and
            # recompressing - the built archive is otherwise untouched.
            if [ -n "$(find "$dir" -name '*.tgz' -print -quit)" ]; then
              while IFS= read -r tgz; do
                out="release_assets/$(basename "$tgz")"
                gzip -dc "$tgz" > "${out%.tgz}.tar"
                tar -rf "${out%.tgz}.tar" -C "$PDF_DIR" README.pdf quicksheet.pdf
                tar -rf "${out%.tgz}.tar" LICENSE LICENSE.commercial LICENSE.noncommercial LICENSE.third_party
                gzip -n -c "${out%.tgz}.tar" > "$out"
                rm -f "${out%.tgz}.tar"
              done < <(find "$dir" -name '*.tgz')
              echo "packaged (pre-built archive + README.pdf + quicksheet.pdf + licenses): $name"
              continue
            fi

            # Windows and macOS: the CI artifact is a directory holding the
            # binary, plus whatever ships beside it (ONNX Runtime DLLs for the
            # Windows CUDA variant). build.yml uploads that
            # directory through a wildcard path, and upload-artifact keeps the
            # directory name after the wildcard, so the binary arrives one
            # level down: vtmate-<version>-<os>-<arch>[-<variant>]/vtmate[.exe].
            # Package from the binary's own directory so it - and everything
            # beside it - lands at the archive's top level.
            bin="$(find "$dir" -type f \( -name vtmate -o -name vtmate.exe \) -print -quit)"
            [ -n "$bin" ] || { echo "no vtmate binary found in $dir" >&2; exit 1; }
            bindir="$(dirname "$bin")"
            case "$bin" in
              *.exe)
                cp LICENSE LICENSE.commercial LICENSE.noncommercial LICENSE.third_party "$bindir"
                ( cd "$bindir" && zip -qr "${GITHUB_WORKSPACE}/release_assets/vtmate-${VERSION}-${name}.zip" . )
                echo "packaged (zip + licenses): $name" ;;
              *)
                cp "$PDF" "$QUICKSHEET" LICENSE LICENSE.commercial LICENSE.noncommercial LICENSE.third_party "$bindir"
                ( cd "$bindir" && tar -czf "${GITHUB_WORKSPACE}/release_assets/vtmate-${VERSION}-${name}.tgz" -- * )
                echo "packaged (tgz + README.pdf + quicksheet.pdf + licenses): $name" ;;
            esac
          done

          echo "--- release_assets ---"
          ls -lh release_assets

      - name: Verify README.pdf, quicksheet.pdf and the licenses reached every tgz
        run: |
          set -euo pipefail
          for a in release_assets/*.tgz; do
            [ -e "$a" ] || continue
            # Read the whole listing first: piping tar straight into grep -q
            # lets grep exit on the match while tar is still writing, and the
            # resulting EPIPE trips pipefail even though the PDF is there.
            listing="$(tar -tzf "$a")"
            for want in README.pdf quicksheet.pdf LICENSE LICENSE.commercial LICENSE.noncommercial LICENSE.third_party; do
              grep -qxF "$want" <<<"$listing" || {
                echo "$want missing from $a" >&2; exit 1; }
            done
            echo "ok: $a"
          done

      # The zips carry the licenses (the PDFs are tgz-only).
      - name: Verify the licenses reached every zip
        run: |
          set -euo pipefail
          for a in release_assets/*.zip; do
            [ -e "$a" ] || continue
            listing="$(unzip -Z1 "$a")"
            for want in LICENSE LICENSE.commercial LICENSE.noncommercial LICENSE.third_party; do
              grep -qxF "$want" <<<"$listing" || {
                echo "$want missing from $a" >&2; exit 1; }
            done
            echo "ok: $a"
          done

      # The installer expects vtmate (vtmate.exe on Windows) at the top level
      # of every archive, never inside a folder.
      - name: Verify the binary sits at the top level of every archive
        run: |
          set -euo pipefail
          for a in release_assets/*; do
            case "$a" in
              *.tgz) want=vtmate;     listing="$(tar -tzf "$a")" ;;
              *.zip) want=vtmate.exe; listing="$(unzip -Z1 "$a")" ;;
              *) continue ;;
            esac
            grep -qxF "$want" <<<"$listing" || {
              echo "$want is not at the top level of $a:" >&2
              sed 's/^/  /' <<<"$listing" >&2; exit 1; }
            echo "ok: $a"
          done

      - name: Fail if no assets were produced
        run: |
          count=$(find release_assets -type f | wc -l)
          echo "asset count: $count"
          [ "$count" -gt 0 ] || { echo "No assets to publish" >&2; exit 1; }

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release_assets/*
